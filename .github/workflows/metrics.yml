name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yagizcngz
          template: classic
          base: ""
          config_timezone: Europe/Istanbul
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          # colors taken from the header scene so similar languages don't share GitHub's blues
          plugin_languages_colors: "python:#ffd23f, typescript:#3355b8, c#:#9b6bff, java:#f08a24, javascript:#e3341a, shell:#4cc9a8"
